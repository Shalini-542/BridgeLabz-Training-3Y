```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Height and Width</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        header {
            text-align: center;
            padding: 25px;
            background-color: #222;
            color: white;
        }

        .container {
            min-height: 70vh;

            display: flex;
            justify-content: center;
            align-items: center;

            gap: 30px;
        }

        /* Box using px */
        .box1 {
            width: 200px;
            height: 150px;
            padding: 20px;
            background-color: lightblue;
            border: 3px solid blue;
        }

        /* Box using percentage */
        .box2 {
            width: 30%;
            height: 200px;
            max-width: 300px;
            padding: 20px;
            background-color: lightgreen;
            border: 3px solid green;
        }

        /* Box using em and vh */
        .box3 {
            width: 15em;
            height: 25vh;
            min-height: 150px;
            padding: 20px;
            background-color: lightcoral;
            border: 3px solid red;

            /* Overflow property */
            overflow: auto;
        }

        footer {
            text-align: center;
            padding: 20px;
            background-color: #222;
            color: white;
        }
    </style>
</head>

<body>

    <header>
        <h1>Height and Width Practice</h1>
    </header>

    <main class="container">

        <div class="box1">
            <h2>Box 1</h2>
            <p>Width: 200px</p>
            <p>Height: 150px</p>
        </div>

        <div class="box2">
            <h2>Box 2</h2>
            <p>Width: 30%</p>
            <p>Max Width: 300px</p>
        </div>

        <div class="box3">
            <h2>Box 3</h2>
            <p>Width: 15em</p>
            <p>Height: 25vh</p>
            <p>Overflow property is applied here.</p>
        </div>

    </main>

    <footer>
        <p>Height and Width Practice</p>
    </footer>

</body>
</html>
