<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Box Sizing Comparison</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eeeeee;
        }

        header {
            text-align: center;
            background: #222;
            color: white;
            padding: 20px;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 30px;
            padding: 50px;
            flex-wrap: wrap;
        }

        .box {
            width: 300px;
            padding: 30px;
            border: 10px solid black;
            min-height: 220px;
        }

        /* Default box sizing */
        .content-box {
            box-sizing: content-box;
            background: lightblue;
        }

        /* Border-box sizing */
        .border-box {
            box-sizing: border-box;
            background: lightgreen;
        }

        h2 {
            text-align: center;
        }
    </style>
</head>

<body>

<header>
    <h1>Box-Sizing Comparison</h1>
</header>

<main class="container">

    <section class="box content-box">
        <h2>Content-Box</h2>

        <p>
            Width applies only to the content.
            Padding and border are added to the total size.
        </p>
    </section>

    <section class="box border-box">
        <h2>Border-Box</h2>

        <p>
            Width includes content, padding and border.
            This makes sizing easier.
        </p>
    </section>

</main>

</body>
</html>
