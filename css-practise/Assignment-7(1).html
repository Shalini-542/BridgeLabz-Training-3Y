```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borders and Padding</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
        }

        header {
            background-color: #222;
            color: white;
            padding: 25px;
        }

        .boxes {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 50px;
        }

        /* Different border styles */
        .box {
            width: 180px;
            padding: 25px;
            background-color: white;
            transition: border-color 0.4s ease;
        }

        .solid {
            border: 5px solid blue;
        }

        .dashed {
            border: 5px dashed green;
        }

        .double {
            border: 5px double red;
        }

        .groove {
            border: 5px groove purple;
        }

        /* Border color changes on hover */
        .box:hover {
            border-color: orange;
        }

        /* Rounded corners */
        .rounded {
            width: 300px;
            margin: 20px auto;
            padding: 30px;
            background-color: lightblue;
            border: 4px solid navy;
            border-radius: 30px;
        }

        footer {
            background-color: #222;
            color: white;
            padding: 20px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Borders and Padding Demonstration</h1>
    </header>

    <main>

        <section class="boxes">

            <div class="box solid">
                <h2>Solid</h2>
                <p>Solid Border</p>
            </div>

            <div class="box dashed">
                <h2>Dashed</h2>
                <p>Dashed Border</p>
            </div>

            <div class="box double">
                <h2>Double</h2>
                <p>Double Border</p>
            </div>

            <div class="box groove">
                <h2>Groove</h2>
                <p>Groove Border</p>
            </div>

        </section>

        <section class="rounded">
            <h2>Rounded Corner</h2>
            <p>Using border-radius</p>
        </section>

    </main>

    <footer>
        <p>Border and Padding Practice</p>
    </footer>

</body>
</html>
