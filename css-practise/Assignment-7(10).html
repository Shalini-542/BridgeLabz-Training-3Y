<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Bar</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        /* Navigation bar */
        nav {
            display: flex;
            justify-content: center;
            align-items: center;

            background-color: #222;
            padding: 15px;
            gap: 10px;
        }

        /* Navigation links */
        nav a {
            color: white;
            text-decoration: none;

            padding: 12px 20px;

            border: 2px solid transparent;
            border-radius: 6px;

            transition: all 0.3s ease;
        }

        /* Hover effect */
        nav a:hover {
            background-color: white;
            color: #222;
            border-color: white;
        }

        /* Active link */
        nav a.active {
            background-color: orange;
            color: black;
        }

        /* Main section */
        .hero {
            min-height: 70vh;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            text-align: center;
        }

        .hero h1 {
            font-size: 40px;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 18px;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 20px;
            background-color: #222;
            color: white;
        }

        /* Responsive navbar below 700px */
        @media (max-width: 700px) {

            nav {
                flex-direction: column;
            }

            nav a {
                width: 100%;
                text-align: center;
            }

            .hero h1 {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

    <header>

        <nav>
            <a href="#" class="active">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Projects</a>
            <a href="#">Contact</a>
        </nav>

    </header>

    <main>

        <section class="hero">
            <h1>Welcome to My Website</h1>
            <p>
                Responsive Navigation Bar using HTML and CSS.
            </p>
        </section>

    </main>

    <footer>
        <p>© 2026 My Website | All Rights Reserved</p>
    </footer>

</body>
</html>
