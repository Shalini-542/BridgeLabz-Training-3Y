<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Image Showcase</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        header {
            text-align: center;
            background: #222;
            color: white;
            padding: 20px;
        }

        /* Grid layout */
        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            padding: 30px;
        }

        figure {
            margin: 0;
            background: white;
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 4px 12px #aaa;
            overflow: hidden;
            text-align: center;
        }

        figure img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 10px;

            /* Smooth scale effect */
            transition: 0.3s ease-in-out;
        }

        /* Image scales on hover */
        figure:hover img {
            transform: scale(1.1);
            filter: brightness(70%);
        }

        figcaption {
            padding: 12px;
            font-weight: bold;
        }

        /* One column below 700px */
        @media (max-width: 700px) {
            .gallery {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Image Showcase</h1>
</header>

<main class="gallery">

    <figure>
        <img src="https://picsum.photos/400/250?1" alt="Nature">
        <figcaption>Nature</figcaption>
    </figure>

    <figure>
        <img src="https://picsum.photos/400/250?2" alt="Mountain">
        <figcaption>Mountain</figcaption>
    </figure>

    <figure>
        <img src="https://picsum.photos/400/250?3" alt="Forest">
        <figcaption>Forest</figcaption>
    </figure>

    <figure>
        <img src="https://picsum.photos/400/250?4" alt="River">
        <figcaption>River</figcaption>
    </figure>

    <figure>
        <img src="https://picsum.photos/400/250?5" alt="Beach">
        <figcaption>Beach</figcaption>
    </figure>

    <figure>
        <img src="https://picsum.photos/400/250?6" alt="City">
        <figcaption>City</figcaption>
    </figure>

</main>

</body>
</html>
