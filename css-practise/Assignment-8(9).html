<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Combined Effects</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        header {
            text-align: center;
            background: #222;
            color: white;
            padding: 20px;
        }

        /* Flexbox layout */
        .container {
            min-height: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .effect-button {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            background: #007bff;
            color: white;
            font-size: 17px;

            box-shadow: 0 4px 10px #aaa;

            /* Smooth transition */
            transition: 0.3s ease-in-out;
        }

        /* Hover combines color, scale and shadow */
        .effect-button:hover {
            background: #28a745;
            transform: scale(1.1);
            box-shadow: 0 8px 18px #888;
        }

        /* Active pseudo-class */
        .effect-button:active {
            transform: scale(0.95);
        }

        /* Focus pseudo-class */
        .effect-button:focus {
            outline: 3px solid orange;
        }
    </style>
</head>

<body>

<header>
    <h1>Combined CSS Effects</h1>
</header>

<main class="container">

    <button class="effect-button">Hover Me</button>

    <button class="effect-button">Click Me</button>

    <button class="effect-button">Focus Me</button>

</main>

</body>
</html>
