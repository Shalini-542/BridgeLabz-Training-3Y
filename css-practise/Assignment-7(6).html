```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transformations</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
        }

        header {
            padding: 25px;
            background-color: #222;
            color: white;
        }

        .container {
            min-height: 70vh;

            display: flex;
            justify-content: center;
            align-items: center;

            gap: 50px;
        }

        .item {
            text-align: center;
        }

        .box {
            width: 150px;
            height: 150px;

            display: flex;
            justify-content: center;
            align-items: center;

            background-color: lightblue;
            border: 3px solid navy;

            transition: all 0.4s ease;
        }

        /* Rotate */
        .rotate:hover {
            transform: rotate(45deg);
        }

        /* Scale */
        .scale:hover {
            transform: scale(1.3);
        }

        /* Translate */
        .translate:hover {
            transform: translateY(-30px);
        }

        /* Skew */
        .skew:hover {
            transform: skew(15deg, 10deg);
        }

        .item p {
            margin-top: 20px;
            font-weight: bold;
        }

        footer {
            padding: 20px;
            background-color: #222;
            color: white;
        }

        /* Responsive */
        @media (max-width: 700px) {
            .container {
                flex-wrap: wrap;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>CSS Transformations Showcase</h1>
    </header>

    <main class="container">

        <section class="item">
            <div class="box rotate">
                Rotate
            </div>
            <p>rotate()</p>
        </section>

        <section class="item">
            <div class="box scale">
                Scale
            </div>
            <p>scale()</p>
        </section>

        <section class="item">
            <div class="box translate">
                Translate
            </div>
            <p>translate()</p>
        </section>

        <section class="item">
            <div class="box skew">
                Skew
            </div>
            <p>skew()</p>
        </section>

    </main>

    <footer>
        <p>Transformation Practice</p>
    </footer>

</body>
</html>
