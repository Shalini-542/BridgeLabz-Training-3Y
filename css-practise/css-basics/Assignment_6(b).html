<!DOCTYPE html>
<html>
<head>
    <title>Q2 - Product Gallery</title>

    <style>

        /* =================================================
           Q2: DESIGN A 4-COLUMN PRODUCT GALLERY USING CSS GRID
           ================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 30px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        /* Product Gallery */
        .gallery {
            display: grid;

            /* 4 columns on desktop */
            grid-template-columns: repeat(4, 1fr);

            gap: 20px;
        }

        /* Product Card */
        .card {
            background-color: white;

            padding: 30px;

            text-align: center;

            /* Equal height */
            min-height: 180px;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            border-radius: 10px;

            transition: 0.3s;
        }

        /* Hover Effect */
        .card:hover {
            transform: scale(1.05);
        }

        .card h2 {
            margin-bottom: 15px;
        }

        .card p {
            font-size: 20px;
            font-weight: bold;
        }

        /* Tablet - 2 Columns */
        @media (max-width: 900px) {

            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        /* Mobile - 1 Column */
        @media (max-width: 600px) {

            .gallery {
                grid-template-columns: 1fr;
            }

        }

    </style>
</head>

<body>

    <!-- =================================================
         Q2: PRODUCT GALLERY
         Create 8 product cards
         ================================================= -->

    <h1>Product Gallery</h1>

    <div class="gallery">

        <!-- Product 1 -->
        <div class="card">
            <h2>Laptop</h2>
            <p>₹50,000</p>
        </div>

        <!-- Product 2 -->
        <div class="card">
            <h2>Smartphone</h2>
            <p>₹25,000</p>
        </div>

        <!-- Product 3 -->
        <div class="card">
            <h2>Headphones</h2>
            <p>₹2,000</p>
        </div>

        <!-- Product 4 -->
        <div class="card">
            <h2>Smart Watch</h2>
            <p>₹4,000</p>
        </div>

        <!-- Product 5 -->
        <div class="card">
            <h2>Keyboard</h2>
            <p>₹1,500</p>
        </div>

        <!-- Product 6 -->
        <div class="card">
            <h2>Mouse</h2>
            <p>₹800</p>
        </div>

        <!-- Product 7 -->
        <div class="card">
            <h2>Speaker</h2>
            <p>₹3,000</p>
        </div>

        <!-- Product 8 -->
        <div class="card">
            <h2>Tablet</h2>
            <p>₹20,000</p>
        </div>

    </div>

</body>
</html>
