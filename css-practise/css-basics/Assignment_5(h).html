<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="Assignment_5(h).css">
</head>
<body>

    <!-- Fixed Header -->
    <header>
        <h1>My Dashboard</h1>
    </header>

    <div class="dashboard">

        <!-- Sidebar -->
        <aside class="sidebar">
            <h2>Menu</h2>

            <nav>
                <a href="#">Dashboard</a>
                <a href="#">Profile</a>
                <a href="#">Analytics</a>
                <a href="#">Settings</a>
                <a href="#">Logout</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">

            <h2>Dashboard Overview</h2>

            <div class="content-boxes">

                <div class="box">
                    <h3>Total Users</h3>
                    <p>1,250</p>
                    <span>Active users</span>
                </div>

                <div class="box">
                    <h3>Total Sales</h3>
                    <p>₹75,000</p>
                    <span>This month's sales</span>
                </div>

                <div class="box">
                    <h3>Projects</h3>
                    <p>24</p>
                    <span>Completed projects</span>
                </div>

                <div class="box">
                    <h3>Messages</h3>
                    <p>48</p>
                    <span>New messages</span>
                </div>

            </div>

        </main>

    </div>

</body>
</html>
