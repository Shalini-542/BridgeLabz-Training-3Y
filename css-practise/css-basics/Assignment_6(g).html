<!DOCTYPE html>
<html>
<head>
    <title>Q8 - Photo Gallery</title>

    <style>

        /* 
        QUESTION 8:
        Create a responsive photo gallery using CSS Grid.

        Requirements:
        1. Use CSS Grid for gallery.
        2. Use:
           grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        3. Images should fill the grid cell.
        4. Images should scale on hover.
        5. Use transition: transform 0.5s ease.
        6. Add captions using <figcaption>.
        7. Gallery should automatically become responsive.
        */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            padding: 30px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        /* Grid Gallery */
        .gallery {
            display: grid;

            /* Automatically adjusts columns */
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));

            gap: 20px;
        }

        /* Each photo box */
        figure {
            background: white;
            padding: 10px;
            border-radius: 10px;
            overflow: hidden;
            text-align: center;
        }

        /* Image */
        figure img {
            width: 100%;
            height: 200px;

            /* Image completely fills the area */
            object-fit: cover;

            transition: transform 0.5s ease;
        }

        /* Image hover effect */
        figure img:hover {
            transform: scale(1.1);
        }

        /* Caption */
        figcaption {
            padding: 15px 5px;
            font-size: 18px;
            font-weight: bold;
        }

    </style>
</head>

<body>

    <h1>My Photo Gallery</h1>

    <div class="gallery">

        <figure>
            <img src="images/nature.image.webp" alt="Nature">
            <figcaption>Nature</figcaption>
        </figure>

        <figure>
            <img src="images/mountain.jpeg" alt="Mountain">
            <figcaption>Mountain</figcaption>
        </figure>

        <figure>
            <img src="images/beach.jpeg" alt="Beach">
            <figcaption>Beach</figcaption>
        </figure>

        <figure>
            <img src="images/forest.jpeg" alt="Forest">
            <figcaption>Forest</figcaption>
        </figure>

        <figure>
            <img src="images/city.jpeg" alt="City">
            <figcaption>City</figcaption>
        </figure>

        <figure>
            <img src="images/sunset.jpeg" alt="Sunset">
            <figcaption>Sunset</figcaption>
        </figure>

    </div>

</body>
</html>
