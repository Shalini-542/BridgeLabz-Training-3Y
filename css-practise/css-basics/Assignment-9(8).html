<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Comparison Layout</title>
    <link rel="stylesheet" href="Assignment-9(8).css">
</head>
<body>

    <main>
        <h1>Filter Comparison</h1>

        <section class="comparison">

            <!-- Before Image -->
            <div class="image-box">
                <img src="https://picsum.photos/600/400?random=10"
                     alt="Original Image">
                <h2>Before</h2>
                <p>Original image without filter.</p>
            </div>

            <!-- After Image -->
            <div class="image-box">
                <img class="filtered"
                     src="https://picsum.photos/600/400?random=10"
                     alt="Filtered Image">
                <h2>After</h2>
                <p>Image with brightness filter.</p>
            </div>

        </section>
    </main>

</body>
</html>
