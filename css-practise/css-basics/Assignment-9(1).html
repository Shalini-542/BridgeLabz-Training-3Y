<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="Assignment-9(1).css">
</head>

<body>

    <header>
        <h1>Image Filter Gallery</h1>
        <p>Different CSS filters applied to images</p>
    </header>

    <main>
        <section class="gallery">

            <figure>
                <img class="blur" src="https://picsum.photos/id/1015/500/350" alt="Mountain">
                <figcaption>Blur</figcaption>
            </figure>

            <figure>
                <img class="grayscale" src="https://picsum.photos/id/1016/500/350" alt="Nature">
                <figcaption>Grayscale</figcaption>
            </figure>

            <figure>
                <img class="sepia" src="https://picsum.photos/id/1018/500/350" alt="Landscape">
                <figcaption>Sepia</figcaption>
            </figure>

            <figure>
                <img class="brightness" src="https://picsum.photos/id/1020/500/350" alt="Forest">
                <figcaption>Brightness</figcaption>
            </figure>

            <figure>
                <img class="contrast" src="https://picsum.photos/id/1024/500/350" alt="Animal">
                <figcaption>Contrast</figcaption>
            </figure>

            <figure>
                <img class="hue" src="https://picsum.photos/id/1025/500/350" alt="Dog">
                <figcaption>Hue Rotate</figcaption>
            </figure>

        </section>
    </main>

    <footer>
        <p>Responsive CSS Gallery</p>
    </footer>

</body>
</html>
