<!DOCTYPE html>
<html>
<head>
    <title>Internship Application Form</title>
    <link rel="stylesheet" href="./css2.css">
</head>
<body>

    <h1>Internship Application Form</h1>

    <form>

        <!-- Personal Details -->
        <label for="name">Full Name:</label><br>
        <input type="text" id="name" name="name"
               placeholder="Enter your full name" required><br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email"
               placeholder="Enter your email" required><br><br>

        <label for="phone">Phone:</label><br>
        <input type="tel" id="phone" name="phone"
               placeholder="Enter phone number" required><br><br>

        <label for="dob">Date of Birth:</label><br>
        <input type="date" id="dob" name="dob" required><br><br>

        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password"
               placeholder="Enter password" required><br><br>

        <!-- Gender -->
        <label>Gender:</label><br>
        <input type="radio" id="male" name="gender" value="Male" required>
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label>

        <input type="radio" id="other" name="gender" value="Other">
        <label for="other">Other</label><br><br>

        <!-- Course -->
        <label for="course">Course:</label><br>
        <select id="course" name="course" required>
            <option value="">Select Course</option>
            <option value="CSE">CSE</option>
            <option value="IT">IT</option>
            <option value="ECE">ECE</option>
            <option value="Mechanical">Mechanical</option>
        </select><br><br>

        <!-- Skills -->
        <label>Skills:</label><br>
        <input type="checkbox" id="java" name="skills" value="Java">
        <label for="java">Java</label><br>

        <input type="checkbox" id="javascript" name="skills" value="JavaScript">
        <label for="javascript">JavaScript</label><br>

        <input type="checkbox" id="html" name="skills" value="HTML">
        <label for="html">HTML</label><br>

        <input type="checkbox" id="css" name="skills" value="CSS">
        <label for="css">CSS</label><br>

        <input type="checkbox" id="react" name="skills" value="React">
        <label for="react">React</label><br><br>

        <!-- Internship Preference -->
        <label>Internship Preference:</label><br>
        <input type="radio" id="frontend" name="internship" value="Frontend" required>
        <label for="frontend">Frontend</label>

        <input type="radio" id="backend" name="internship" value="Backend">
        <label for="backend">Backend</label>

        <input type="radio" id="fullstack" name="internship" value="Full Stack">
        <label for="fullstack">Full Stack</label><br><br>

        <!-- Resume -->
        <label for="resume">Upload Resume:</label><br>
        <input type="file" id="resume" name="resume" required><br><br>

        <!-- Cover Letter -->
        <label for="cover">Cover Letter:</label><br>
        <textarea id="cover" name="cover" rows="5" cols="40"
                  placeholder="Write your cover letter here"></textarea><br><br>

        <!-- Buttons -->
        <input type="submit" value="Submit">
        <input type="reset" value="Reset">

    </form>

</body>
</html>
